<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contact | Marsuki</title>
<meta name="theme-color" content="#fcfbf7">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="common.js" defer></script></head>
<body data-page="contact">
<main class="wrap">
<div class="ptitle"><p class="eyebrow">Contact</p><h1>Questions? <em>Ask us.</em></h1><p>About a product, an order, or which herb to start with.</p></div>
<section class="sec cgrid"><div class="info"><h2>Contact details</h2><p style="margin-bottom:10px">We reply within one working day.</p>
<a id="cMail" href="#"><i data-ic="mail"></i><span></span></a><a id="cTel" href="#"><i data-ic="phone"></i><span></span></a><a id="cWa" href="#" target="_blank" rel="noopener"><i data-ic="chat"></i><span>Chat on WhatsApp</span></a><a id="cLoc" href="#"><i data-ic="pin"></i><span></span></a></div>
<form class="form" id="cform" novalidate><div class="two"><label>Name<input name="name" autocomplete="name"></label><label>Email<input name="email" type="email" autocomplete="email"></label></div>
<label>Phone (optional)<input name="phone" type="tel" autocomplete="tel"></label><label>Message<textarea name="message"></textarea></label>
<p class="fmsg" id="fmsg" role="status"></p><div class="ctas"><button class="btn clay" type="submit" data-send="wa"><i data-ic="chat"></i>Send on WhatsApp</button><button class="btn ghost" type="submit" data-send="mail"><i data-ic="mail"></i>Send by email</button></div></form></section>
</main>
<script>addEventListener('DOMContentLoaded',()=>{const C=CONFIG,s=(id,h,t)=>{const a=document.getElementById(id);if(h)a.href=h;a.querySelector('span').textContent=t||a.querySelector('span').textContent};
s('cMail','mailto:'+C.EMAIL,C.EMAIL);s('cTel','tel:'+C.PHONE.replace(/\s/g,''),C.PHONE);s('cWa','https://wa.me/'+C.WHATSAPP);s('cLoc','https://maps.google.com/?q='+encodeURIComponent(C.ADDRESS),C.ADDRESS)})</script>
</body></html>
